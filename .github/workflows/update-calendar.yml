name: Update calendar data

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch calendar
        run: |
          mkdir -p data
          curl -sL "https://calendar.google.com/calendar/ical/39e6dc7272871c0d60eddef8e6232fd41c70d6a319d944de5419ff4758265a86%40group.calendar.google.com/private-92d087279f48b31dc9a4df04d624a2f4/basic.ics" -o data/calendar.ics

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/calendar.ics
          git diff --staged --quiet || git commit -m "Update calendar data"
          git push
